<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 44" width="120" height="44" role="img" aria-label="Email">
<defs>
  <style>
    text { font-family: Inter, -apple-system, 'Segoe UI', Arial, sans-serif; }
    .btn-card {
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .btn-card:hover rect.btn-bg {
      stroke: #EA4335;
      stroke-width: 1.5;
      filter: drop-shadow(0 0 8px #EA433566);
    }
    .rise { animation: rise .8s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</defs>
<rect width="120" height="44" fill="#0d1117"/>
<g class="rise btn-card">
  <rect class="btn-bg" x="1" y="1" width="118" height="42" rx="9" fill="#161b22" stroke="#30363d"/>
  <svg x="18" y="13" width="18" height="18" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" fill="#EA4335"/></svg>
  <text x="70" y="27" text-anchor="middle" font-size="13.5" font-weight="600" fill="#f0f6fc">Email</text>
</g>
</svg>