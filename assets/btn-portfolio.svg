<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 44" width="144" height="44" role="img" aria-label="Portfolio">
<defs>
  <style>
    text { font-family: Inter, -apple-system, 'Segoe UI', Arial, sans-serif; }
    .btn-card {
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .btn-card:hover rect.btn-bg {
      stroke: #39d353;
      stroke-width: 1.5;
      filter: drop-shadow(0 0 8px #39d35366);
    }
    .rise { animation: rise .8s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</defs>
<rect width="144" height="44" fill="#0d1117"/>
<g class="rise btn-card">
  <rect class="btn-bg" x="1" y="1" width="142" height="42" rx="9" fill="#161b22" stroke="#30363d"/>
  <svg x="18" y="13" width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#39d353" stroke-width="2"/><ellipse cx="12" cy="12" rx="4.5" ry="9" fill="none" stroke="#39d353" stroke-width="1.8"/><line x1="3" y1="12" x2="21" y2="12" stroke="#39d353" stroke-width="1.8"/></svg>
  <text x="82" y="27" text-anchor="middle" font-size="13.5" font-weight="600" fill="#f0f6fc">Portfolio</text>
</g>
</svg>