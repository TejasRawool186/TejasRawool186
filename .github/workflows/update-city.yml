name: Update Contribution City

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Contribution City SVG
        env:
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/generate-city.js

      - name: Commit updated contribution city graphic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/city.svg
          git diff --staged --quiet || (git commit -m "chore: update contribution city skyline" && git push)
